services:
  grabarr:
    image: grabarr:latest
    restart: unless-stopped
    environment:
      - PROWLARR_URL=http://prowlarr:9696
      - PROWLARR_API_KEY=
      - TMDB_API_KEY=
      - PLEX_URL=http://plex:32400
      - PLEX_TOKEN=
      - PLEX_LIBRARY_MOVIES=Filmy
      - PLEX_LIBRARY_SERIES=Seriale
      - DELUGE_URL=http://deluge:8112
      - DELUGE_PASSWORD=
      - MOVIES_DIR=/plex/movies
      - SERIES_DIR=/plex/series
      - DB_PATH=/data/grabarr.db
      - REMOTE_USER_HEADER=X-Authentik-Username
      - POLL_SECONDS=60
    volumes:
      - ./data:/data
      - ./config.yaml:/app/config.yaml:ro
      - ./downloads:/downloads:ro
      - ./plex/movies:/plex/movies
      - ./plex/series:/plex/series
    ports:
      - "8000:8000"
